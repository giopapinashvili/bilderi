<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>შაბლონი სუფრა</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,300..900&family=Noto+Serif+Georgian:wght@400..800&display=swap">
<style>
/* VOICE  სამუშაო ხელსაწყო, წყნარი: ყურადღება საიტზეა და არა ჩარჩოზე
   IDEA   საბეჭდი მაგიდა: საიტის ანაბეჭდი შუაშია, ზემოთ ნიმუშებს ფურცლავ
   PICTURE თვითონ საიტი, მთელ სცენაზე, ცოცხლად
   COLOUR თეთრი ზოლი და მუქი ტექსტი; სცენა ნეიტრალური ნაცრისფერი, რომ საიტის ფერებს არ ეჯიბრებოდეს
   TYPE   Noto Sans Georgian 400 და 700
   LAYOUT ლეპტოპზე ერთი ზოლი ზემოთ და სცენა ქვემოთ; ტელეფონზე ზოლი ორ რიგად იშლება */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141518);--ink:light-dark(#16171a,#eceef1);--muted:light-dark(#5f626a,#a3a7af);--line:light-dark(#e2e3e6,#2a2c31);--stage:light-dark(#d8d9dc,#0a0b0d);--chip:light-dark(#f0f1f3,#1f2125);--sel:light-dark(#16171a,#eceef1);--selink:light-dark(#ffffff,#141518);--frame:light-dark(#16171a,#2e3035)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Noto Sans Georgian',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #2b6cff;outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:10px max(2vw,16px);border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:2}
.who{flex:1 1 240px}
.who h1{font-size:17px;line-height:1.2;margin:0;font-weight:700}
.who p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;min-height:44px;text-align:left;line-height:1.2}
.seg button span{display:block;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--selink)}
.seg button[aria-pressed=true] span{color:inherit;opacity:.75}
.seg.dev button{padding:6px 12px;display:flex;align-items:center;gap:6px}
.seg svg{width:18px;height:18px;flex:none}
.file{border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:52px;padding:0 16px;font-weight:700}
.file:hover{background:var(--chip)}
.stage{flex:1;background:var(--stage);display:flex;justify-content:center;align-items:flex-start;overflow:auto;position:relative}
#site{border:0;display:block;width:100%;height:100%;background:#fff}
.stage.phone{padding:28px 16px}
.stage.phone #site{width:390px;max-width:100%;height:min(844px,calc(100% - 4px));flex:none;border-radius:30px;box-shadow:0 0 0 10px var(--frame)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5;transform:translateX(102%);transition:transform .22s ease;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dh{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.dh h2{margin:0 0 6px;font-size:22px;line-height:1.2}
.dh p{margin:0 0 10px;color:var(--muted);max-width:52ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:0 0 14px}
.facts b{font-variant-numeric:tabular-nums}
.dact{display:flex;gap:8px}
.dact button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.dact button.pri{background:var(--sel);color:var(--selink);border-color:var(--sel)}
pre{flex:1;margin:0;overflow:auto;padding:16px 20px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--chip);white-space:pre}
.k{color:light-dark(#7a2bbf,#c79bff)}.s{color:light-dark(#0b6b3a,#7fd6a4)}.n{color:light-dark(#b4410b,#ffab70)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:4;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--sel);color:var(--selink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:6;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
@media(max-width:820px){.who{flex-basis:100%}.dev{display:none}}
@media(max-width:600px){.bar{gap:8px}.seg.sites{flex:1;overflow-x:auto;scrollbar-width:none}.seg.sites button{flex:1 0 auto;padding:6px 10px}.seg.sites button span,.file .opt{display:none}.file{min-height:52px;padding:0 12px}}
@media(prefers-reduced-motion:reduce){.drawer,.scrim,.toast{transition:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="who">
    <h1>შაბლონი „სუფრა"</h1>
    <p>ერთი შაბლონი, სამი საიტი. ბიზნესები გამოგონილია, ფოტოების ადგილას ჯერ ნახატებია.</p>
  </div>
  <div class="seg sites" id="tabs" role="group" aria-label="ნიმუში-საიტები"></div>
  <div class="seg dev" role="group" aria-label="ეკრანი">
    <button type="button" id="d-desk" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>კომპიუტერი</button>
    <button type="button" id="d-phone" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>ტელეფონი</button>
  </div>
  <button type="button" class="file" id="open-file"><span class="opt">აღწერის </span>ფაილი</button>
</header>
<main class="stage" id="stage"><iframe id="site" title="საიტის პრევიუ"></iframe></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="აღწერის ფაილი" aria-hidden="true">
  <div class="dh">
    <h2>აღწერის ფაილი</h2>
    <p id="d-text"></p>
    <div class="facts" id="d-facts"></div>
    <div class="dact"><button type="button" class="pri" id="copy">კოპირება</button><button type="button" id="close-file">დახურვა</button></div>
  </div>
  <pre id="json"></pre>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* შაბლონი „სუფრა" — კაფეებისა და რესტორნებისთვის. ვერსია 2.
   renderSite(site) ერთ საიტის აღწერას (JSON) სრულ HTML გვერდად აქცევს.
   renderParts(site, {edit:true}) რედაქტორისთვისაა: ტექსტებს, ფოტოებს და სექციებს
   data-e / data-img / data-sec ნიშნებს უმატებს, რომ საიტზე პირდაპირ შეიცვალოს.
   სუფთა ფუნქციაა, DOM-ს არ იყენებს: იმუშავებს ბრაუზერშიც და Cloudflare Worker-შიც. */
(function (root) {
  'use strict';

  const PLATFORM = { madeWith: 'აწყობილია ბილდერზე', url: '#' }; // დროებითი სახელი

  const FONT_CSS = 'https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,300..900&family=Noto+Serif+Georgian:wght@400..800&display=swap';

  const FONTS = {
    modern: { display: "'Noto Sans Georgian','Noto Sans',system-ui,sans-serif", weight: 800, stretch: '74%', track: '-0.02em' },
    classic: { display: "'Noto Serif Georgian','Noto Serif',Georgia,serif", weight: 700, stretch: '100%', track: '-0.015em' }
  };
  const CORNERS = { sharp: '2px', soft: '10px', round: '24px' };
  const DEFAULT_COLORS = { bg: '#ffffff', ink: '#16181d', surface: '#f1f2f4', accent: '#c8102e', accentInk: '#ffffff' };
  const TONES = ['base', 'surface', 'accent', 'inverse', 'custom'];
  const LABELS = { hero: 'მთავარი ბლოკი', menu: 'მენიუ', about: 'ჩვენ შესახებ', gallery: 'ფოტოები', visit: 'მისამართი', cta: 'ბანერი' };
  const NAV_DEFAULT = { menu: 'მენიუ', about: 'ჩვენ შესახებ', gallery: 'ფოტოები', visit: 'მისამართი' };

  // ყველაფერი, რასაც მომხმარებელი წერს, აქ გადის: ასე სხვისი კოდი საიტში ვერ ჩაჯდება.
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const okLink = (s) => /^(https?:\/\/|tel:|mailto:|#[\w-]*$)/i.test(s);
  const imgSrc = (u) => { const s = String(u ?? '').trim(); return /^(https?:\/\/|\/|data:image\/)/i.test(s) ? esc(s) : ''; };
  const color = (c, d) => (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(String(c || '')) ? c : d);
  const tel = (p) => 'tel:' + String(p || '').replace(/[^\d+]/g, '');
  const wa = (n) => 'https://wa.me/' + String(n || '').replace(/\D/g, '');
  const num = (p) => {
    const n = Number(p);
    if (p === '' || p == null || !isFinite(n)) return esc(p);
    return String(Number.isInteger(n) ? n : n.toFixed(2));
  };
  const lum = (hex) => {
    let h = hex.slice(1);
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const ch = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  };
  const autoInk = (bg) => (lum(bg) > 0.42 ? '#16181d' : '#ffffff');

  function make(site, opts) {
    site = site || {};
    const edit = !!(opts && opts.edit);
    const c = site.contact || {};
    const E = (p) => (edit ? ` data-e="${p}"` : '');
    const N = (p) => (edit ? ` data-e="${p}" data-num="1"` : '');
    const I = (p) => (edit ? ` data-img="${p}"` : '');
    const href = (u) => {
      const s = String(u ?? '').trim();
      if (s === '@phone') return esc(tel(c.phone));
      if (s === '@whatsapp') return esc(wa(c.whatsapp || c.phone));
      return okLink(s) ? esc(s) : '#';
    };
    const has = (im) => !!(im && imgSrc(im.src));
    const img = (im, cls, path, first) => {
      if (!has(im)) return edit ? `<div class="${cls} img-empty"${I(path)}><span>ფოტოს დამატება</span></div>` : '';
      return `<img class="${cls}" src="${imgSrc(im.src)}" alt="${esc(im.alt)}"${first ? ' fetchpriority="high"' : ' loading="lazy"'} decoding="async"${I(path)}>`;
    };
    const btns = (list, base) => {
      const out = (list || []).map((b, j) => {
        if (!b || (!b.label && !edit)) return '';
        const outline = b.style ? b.style === 'outline' : j > 0;
        return `<a class="btn${outline ? ' btn-alt' : ''}" href="${href(b.link)}"${edit ? ` data-btn="${base}.${j}"` : ''}><span${E(`${base}.${j}.label`)}>${esc(b.label)}</span></a>`;
      }).join('');
      return out ? `<div class="actions">${out}</div>` : '';
    };
    const sid = (s) => esc(s.id || s.type);
    const open = (s, i, cls, withId) => {
      const t = TONES.includes(s.tone) ? s.tone : 'base';
      let style = '';
      if (t === 'custom') {
        const bg = color(s.bg, '#ffffff');
        const fg = color(s.fg, autoInk(bg));
        style = ` style="--b:${bg};--t:${fg};--hi:${fg};--bb:${fg};--bi:${bg}"`;
      }
      return `<section class="${cls} tone-${t}"${withId === false ? '' : ` id="${sid(s)}"`}${style}${edit ? ` data-sec="${i}"` : ''}>`;
    };
    const P = (i) => `sections.${i}`;

    const S = {};

    S.hero = (s, i) => {
      const lead = s.tagline ? `<p class="lead"${E(P(i) + '.tagline')}>${esc(s.tagline)}</p>` : '';
      const note = s.note ? `<p class="note"${E(P(i) + '.note')}>${esc(s.note)}</p>` : '';
      const actions = btns(s.buttons, P(i) + '.buttons');
      const h1 = `<h1${E('name')}>${esc(site.name)}</h1>`;
      if (s.variant === 'photo') {
        return `<section class="hero hero-photo"${edit ? ` data-sec="${i}"` : ''}>${img(s.image, 'hero-bg', P(i) + '.image', true)}
<div class="hero-in">${h1}${lead}${actions}${note}</div></section>`;
      }
      const fig = has(s.image) || edit ? `<figure class="hero-fig">${img(s.image, 'hero-img', P(i) + '.image', true)}</figure>` : '';
      return `${open(s, i, 'hero hero-poster band', false)}<div class="wrap">
<div class="hero-top">${h1}${note}</div>
<div class="hero-grid${fig ? '' : ' no-img'}"><div class="hero-side">${lead}${actions}</div>${fig}</div></div></section>`;
    };

    S.menu = (s, i) => {
      const cats = (s.categories || []).map((cat, k) => {
        const cp = `${P(i)}.categories.${k}`;
        return `<div class="cat"><h3${E(cp + '.name')}>${esc(cat.name)}</h3><ul>${(cat.items || []).map((it, j) => {
          const ip = `${cp}.items.${j}`;
          return `<li><div class="item"><span class="nm"${E(ip + '.name')}>${esc(it.name)}</span>${it.tag ? `<span class="tag"${E(ip + '.tag')}>${esc(it.tag)}</span>` : ''}<span class="fill"></span><span class="pr"><span${N(ip + '.price')}>${num(it.price)}</span>&nbsp;₾</span></div>${it.desc ? `<p class="ds"${E(ip + '.desc')}>${esc(it.desc)}</p>` : ''}</li>`;
        }).join('')}</ul></div>`;
      }).join('');
      const title = s.title ?? 'მენიუ';
      return `${open(s, i, 'band')}<div class="wrap">
${title || s.note ? `<div class="head">${title ? `<h2${E(P(i) + '.title')}>${esc(title)}</h2>` : ''}${s.note ? `<p${E(P(i) + '.note')}>${esc(s.note)}</p>` : ''}</div>` : ''}
<div class="cats">${cats}</div>${btns(s.buttons, P(i) + '.buttons')}</div></section>`;
    };

    S.about = (s, i) => {
      const pic = has(s.image) || edit ? img(s.image, 'about-img', P(i) + '.image') : '';
      const title = s.title ?? 'ჩვენ შესახებ';
      return `${open(s, i, 'band')}<div class="wrap about${pic ? '' : ' no-img'}${s.flip ? ' flip' : ''}">
${pic}<div class="about-text">${title ? `<h2${E(P(i) + '.title')}>${esc(title)}</h2>` : ''}${(s.paragraphs || []).map((p, k) => (p || edit ? `<p${E(`${P(i)}.paragraphs.${k}`)}>${esc(p)}</p>` : '')).join('')}${btns(s.buttons, P(i) + '.buttons')}</div></div></section>`;
    };

    S.gallery = (s, i) => {
      const ims = (s.images || []).filter((im) => has(im) || edit).slice(0, 12);
      const mode = ims.length === 5 ? 'g5' : ims.length === 3 ? 'g3' : 'gn';
      const title = s.title ?? 'ფოტოები';
      const tiles = ims.length
        ? ims.map((im) => `<figure>${img(im, 'g-img', `${P(i)}.images.${(s.images || []).indexOf(im)}`)}</figure>`).join('')
        : (edit ? `<figure><div class="g-img img-empty" data-img="${P(i)}.images.0"><span>ფოტოების დამატება</span></div></figure>` : '');
      return `${open(s, i, 'band')}<div class="wrap">
${title || s.note ? `<div class="head">${title ? `<h2${E(P(i) + '.title')}>${esc(title)}</h2>` : ''}${s.note ? `<p${E(P(i) + '.note')}>${esc(s.note)}</p>` : ''}</div>` : ''}
<div class="grid ${mode}">${tiles}</div>${btns(s.buttons, P(i) + '.buttons')}</div></section>`;
    };

    S.visit = (s, i) => {
      const map = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.mapQuery || c.address || site.name || '');
      const hours = (site.hours || []).map((h, k) => `<div class="row"><dt${E(`hours.${k}.days`)}>${esc(h.days)}</dt><dd${E(`hours.${k}.time`)}>${esc(h.time)}</dd></div>`).join('');
      const row = (k, u, v, path, pre) => `<li class="row"><span>${k}</span><a href="${href(u)}">${pre || ''}<span${E(path)}>${esc(v)}</span></a></li>`;
      const links = [
        c.phone && row('ტელეფონი', tel(c.phone), c.phone, 'contact.phone'),
        c.whatsapp && row('WhatsApp', wa(c.whatsapp), s.waLabel ?? 'მოგვწერეთ', P(i) + '.waLabel'),
        c.instagram && row('Instagram', 'https://instagram.com/' + encodeURIComponent(c.instagram), c.instagram, 'contact.instagram', '@'),
        c.facebook && row('Facebook', 'https://facebook.com/' + encodeURIComponent(c.facebook), c.facebook, 'contact.facebook')
      ].filter(Boolean).join('');
      const title = s.title ?? 'გვესტუმრეთ';
      const mapLabel = s.mapLabel ?? 'რუკაზე ნახვა';
      return `${open(s, i, 'band')}<div class="wrap visit">
<div class="v-main">${title ? `<h2${E(P(i) + '.title')}>${esc(title)}</h2>` : ''}${c.address ? `<p class="addr"${E('contact.address')}>${esc(c.address)}</p>` : ''}${s.note ? `<p class="v-note"${E(P(i) + '.note')}>${esc(s.note)}</p>` : ''}
${mapLabel ? `<div class="actions"><a class="btn" href="${esc(map)}"${edit ? ` data-btn="${P(i)}.map"` : ''}><span${E(P(i) + '.mapLabel')}>${esc(mapLabel)}</span></a></div>` : ''}${btns(s.buttons, P(i) + '.buttons')}</div>
${hours ? `<div><h3${E(P(i) + '.hoursTitle')}>${esc(s.hoursTitle ?? 'სამუშაო საათები')}</h3><dl class="list">${hours}</dl></div>` : ''}
${links ? `<div><h3${E(P(i) + '.contactTitle')}>${esc(s.contactTitle ?? 'კონტაქტი')}</h3><ul class="list">${links}</ul></div>` : ''}</div></section>`;
    };

    S.cta = (s, i) => `${open(s, i, 'band cta')}<div class="wrap cta-in"><div>${s.title ? `<h2${E(P(i) + '.title')}>${esc(s.title)}</h2>` : ''}${s.text ? `<p class="cta-text"${E(P(i) + '.text')}>${esc(s.text)}</p>` : ''}</div>${btns(s.buttons, P(i) + '.buttons')}</div></section>`;

    const all = (site.sections || []).map((s, i) => ({ s, i })).filter(({ s }) => s && s.enabled !== false && S[s.type]);

    const b = site.brand || {};
    const logo = has(b.logo) ? `<img class="logo-img" src="${imgSrc(b.logo.src)}" alt="${esc(site.name)}"${I('brand.logo')}>` : '';
    const showName = !logo || b.showName !== false;
    const navLinks = all.filter(({ s }) => (s.inNav ?? !!NAV_DEFAULT[s.type]) && s.type !== 'hero')
      .map(({ s, i }) => `<a href="#${sid(s)}"${E(P(i) + '.navLabel')}>${esc(s.navLabel ?? NAV_DEFAULT[s.type] ?? s.title ?? LABELS[s.type])}</a>`).join('');
    const nb = site.navButton || {};
    const showNb = nb.show !== false && (nb.link || c.phone);

  const $ = (id) => document.getElementById(id);
  const frame = $('site'), stage = $('stage'), tabs = $('tabs'), drawer = $('drawer'), scrim = $('scrim');
  let cur = 0, toastTimer = 0;

  const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600); };
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const pretty = (o) => esc(JSON.stringify(o, null, 2))
    .replace(/("(?:[^"\\]|\\.)*")(\s*:)/g, '<span class="k">$1</span>$2')
    .replace(/:\s("(?:[^"\\]|\\.)*")/g, ': <span class="s">$1</span>')
    .replace(/(^|\s|\[)("(?:[^"\\]|\\.)*")(,?)$/gm, '$1<span class="s">$2</span>$3')
    .replace(/:\s(-?\d+(?:\.\d+)?|true|false)/g, ': <span class="n">$1</span>');

  tabs.innerHTML = SITES.map((s, i) => `<button type="button" data-i="${i}" aria-pressed="false">${esc(s.name)}<span>${esc(s.kind)}</span></button>`).join('');

  function show(i) {
    cur = i;
    const site = SITES[i];
    frame.srcdoc = Supra.renderSite(DemoArt.apply(site));
    tabs.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
    const bytes = new Blob([JSON.stringify(site)]).size;
    const on = site.sections.filter((s) => s.enabled !== false).length;
    const off = site.sections.length - on;
    $('d-text').textContent = `ეს ფაილი არის მთელი საიტი „${site.name}". რედაქტორი მხოლოდ ამ ფაილს შეცვლის, შაბლონი კი მისგან გვერდს ააწყობს.`;
    $('d-facts').innerHTML = `<span>ზომა <b>${(bytes / 1024).toFixed(1)} KB</b></span><span>სექციები <b>${on}</b>${off ? ` ჩართული, <b>${off}</b> გამორთული` : ''}</span><span>შრიფტი <b>${site.theme.font === 'classic' ? 'სერიფიანი' : 'ვიწრო'}</b></span>`;
    $('json').innerHTML = pretty(site);
    if (location.hash.slice(1) !== site.slug) history.replaceState(null, '', '#' + site.slug);
  }

  frame.addEventListener('load', () => {
    const d = frame.contentDocument;
    if (!d) return;
    d.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('a');
      if (!a) return;
      const h = a.getAttribute('href') || '';
      e.preventDefault();
      if (h.startsWith('#')) {
        const el = h === '#top' ? d.body : d.getElementById(h.slice(1));
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        toast('გამოქვეყნებულ საიტზე ეს ღილაკი გაიხსნება: ' + h.replace(/^https?:\/\//, '').replace(/^tel:/, 'ზარი ').slice(0, 48));
      }
    });
  });

  const setDevice = (phone) => {
    stage.classList.toggle('phone', phone);
    $('d-desk').setAttribute('aria-pressed', String(!phone));
    $('d-phone').setAttribute('aria-pressed', String(phone));
  };
  const openFile = (open) => {
    drawer.classList.toggle('open', open);
    drawer.setAttribute('aria-hidden', String(!open));
    scrim.classList.toggle('on', open);
    if (open) $('copy').focus(); else $('open-file').focus();
  };

  tabs.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(Number(b.dataset.i)); });
  $('d-desk').addEventListener('click', () => setDevice(false));
  $('d-phone').addEventListener('click', () => setDevice(true));
  $('open-file').addEventListener('click', () => openFile(true));
  $('close-file').addEventListener('click', () => openFile(false));
  scrim.addEventListener('click', () => openFile(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && drawer.classList.contains('open')) openFile(false); });
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(SITES[cur], null, 2)); toast('ფაილი დაკოპირდა'); }
    catch (err) { toast('კოპირება ვერ მოხერხდა: მონიშნე ტექსტი და დააკოპირე ხელით'); }
  });
  const fromHash = () => { const i = SITES.findIndex((s) => s.slug === location.hash.slice(1)); show(i < 0 ? 0 : i); };
  window.addEventListener('hashchange', fromHash);
  fromHash();
}
