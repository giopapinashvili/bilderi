<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ჩემი საიტები, ბილდერი</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,300..900&family=Noto+Serif+Georgian:wght@400..800&display=swap">
<style>
/* ბილდერის საერთო სტილი: შესვლა და „ჩემი საიტები" */
:root{color-scheme:light;--bg:#fff;--ink:#1A1423;--ink-2:#4A4352;--muted:#6E6876;--line:#E7E4EC;--line-2:#D9D5DF;--soft:#F6F4F9;--red:#E8253F;--red-d:#CC1730;--red-s:#FDECEF;--sun:#FFC83D;--cob:#2438D6;--cob-s:rgba(36,56,214,.12);--f:'Noto Sans Georgian','Noto Sans',system-ui,sans-serif;--serif:'Noto Serif Georgian','Noto Serif',Georgia,serif;--ease:cubic-bezier(.2,.7,.2,1);--pad:max(4vw,20px)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f)}
h1,h2,h3{margin:0;font-weight:800;font-stretch:72%;letter-spacing:-.015em;line-height:1.02;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus-visible{outline:3px solid var(--cob);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-stretch:72%;font-size:27px;letter-spacing:-.01em;line-height:1}
.mark{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--red);color:#fff;font-size:20px;font-stretch:100%;transform:rotate(-7deg);transition:transform .35s var(--ease)}
.logo:hover .mark{transform:rotate(0) scale(1.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:2px solid transparent;font:600 16px/1 var(--f);text-decoration:none;white-space:nowrap;cursor:pointer;transition:transform .18s var(--ease),background-color .18s,color .18s,box-shadow .18s,border-color .18s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover:not(:disabled){background:var(--red-d);box-shadow:0 12px 24px -12px rgba(232,37,63,.75)}
.btn-ink{background:var(--ink);color:#fff}
.btn-line{border-color:var(--line-2);background:#fff;color:var(--ink)}
.btn-line:hover:not(:disabled){border-color:var(--ink)}
.btn-sm{min-height:42px;padding:0 14px;font-size:15px;border-radius:11px}
.wide{width:100%}
.lnk{border:0;background:none;padding:0;font-weight:600;font-size:inherit;color:var(--cob);cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline}
.fld{display:block;margin-bottom:14px}
.fld>.lt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.fld small{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.inp{width:100%;min-height:50px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:400 16px/1.3 var(--f);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:var(--line-2)}
.inp:focus{outline:none;border-color:var(--cob);box-shadow:0 0 0 3px var(--cob-s)}
.inp[aria-invalid=true]{border-color:var(--red)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14.5px;line-height:1.5}
.note.err{background:var(--red-s);color:#A1102A}
.note.ok{background:#EAF0FF;color:#1B2B9E}
.note.warn{background:#FFF4DE;color:#7A4A00}
.toast{position:fixed;left:50%;bottom:22px;z-index:120;max-width:calc(100% - 32px);transform:translate(-50%,12px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(26,20,35,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.modal.open{opacity:1;visibility:visible}
.mbox{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:24px;padding:28px;transform:translateY(16px) scale(.98);transition:transform .35s var(--ease)}
.modal.open .mbox{transform:none}
.x{position:absolute;right:12px;top:12px;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:var(--soft);cursor:pointer}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* VOICE   სამუშაო მაგიდა: მშვიდი, ყველაფერი ერთ ეკრანზე
   IDEA    სტამბის თარო, სადაც თითო ბარათი შენი საიტის ანაბეჭდია
   PICTURE საიტის ბარათები მათივე ფერებით და სახელით
   COLOUR  ღია ნაცრისფერი ფონი, თეთრი ბარათები, ბროწეული მთავარ ღილაკზე
   TYPE    Noto Sans Georgian, სათაური ვიწრო 800
   LAYOUT  ზედა ზოლი, სათაური + ლიმიტი + ღილაკი, ბადე 3 სვეტად; ტელეფონზე ერთ სვეტად */
body{background:var(--soft);min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:0 var(--pad);height:68px;display:flex;align-items:center;gap:28px}
.nav{display:flex;gap:22px;margin-right:auto}
.nav a{position:relative;padding:8px 0;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink-2)}
.nav a[aria-current=page]{color:var(--ink)}
.nav a[aria-current=page]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--red)}
.who{position:relative}
.who-btn{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:99px;background:#fff;cursor:pointer;font-weight:600;font-size:14px}
.who-btn:hover{border-color:var(--line-2)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--cob);color:#fff;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.who-name{max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:220px;padding:6px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line),0 20px 40px -20px rgba(26,20,35,.5);display:none}
.menu.open{display:block}
.menu p{padding:8px 10px 10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:6px;overflow-wrap:anywhere}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 10px;border:0;border-radius:9px;background:none;text-align:left;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
.menu button:hover,.menu a:hover{background:var(--soft)}
.danger{color:var(--red)}
main{max-width:1240px;margin:0 auto;padding:clamp(28px,4vw,52px) var(--pad) 64px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin-bottom:28px}
.head h1{font-size:clamp(40px,5vw,56px)}
.usage{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:14.5px;color:var(--ink-2)}
.bar{width:120px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:6px;transition:width .5s var(--ease)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px}
.card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 28px 50px -32px rgba(26,20,35,.55);border-color:var(--line-2)}
.thumb{position:relative;display:block;height:170px;background:var(--b);overflow:hidden;text-decoration:none}
.thumb .h{position:absolute;inset:0 0 38% 0;background:var(--c);color:var(--tc);display:flex;align-items:flex-end;padding:16px 18px;font-weight:800;font-stretch:72%;font-size:34px;line-height:.95;letter-spacing:-.02em}
.thumb.serif .h{font-family:var(--serif);font-stretch:100%;font-weight:700;font-size:28px}
.thumb .l{position:absolute;left:18px;right:18px;height:6px;border-radius:4px;background:var(--t);opacity:.18}
.thumb .l1{bottom:44px}.thumb .l2{bottom:30px;right:45%}.thumb .l3{bottom:16px;right:62%;background:var(--c);opacity:.7}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{font-size:24px;font-stretch:80%}
.addr{font-size:14px;color:var(--cob);font-weight:600;overflow-wrap:anywhere;text-decoration:none}
a.addr:hover{text-decoration:underline}
.addr.muted{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.pill i{width:7px;height:7px;border-radius:50%;background:#A8A2B0}
.pill.live i{background:var(--red)}
.pill.chg{background:#FFF4DE;color:#7A4A00}.pill.chg i{background:#F0A21E}
.acts{display:flex;gap:8px;margin-top:10px}
.acts .btn-ink{flex:1}
.more{position:relative}
.ib{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:11px;background:#fff;cursor:pointer}
.ib:hover{border-color:var(--ink)}
.more .menu{bottom:calc(100% + 8px);top:auto}
.add{display:grid;place-items:center;align-content:center;gap:10px;min-height:340px;border:2px dashed var(--line-2);border-radius:22px;background:transparent;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:16px;transition:border-color .2s,color .2s,background-color .2s}
.add:hover:not(:disabled){border-color:var(--red);color:var(--red);background:var(--red-s)}
.add:disabled{cursor:default;opacity:.7}
.add .plus{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px var(--line)}
.add small{font-weight:500;color:var(--muted);font-size:13.5px;max-width:26ch;text-align:center}
.empty{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center;padding:clamp(28px,4vw,48px);border-radius:28px;background:var(--sun);overflow:hidden}
.empty h2{font-size:clamp(36px,4.4vw,52px);max-width:12ch}
.empty p{margin:14px 0 22px;max-width:36ch;font-size:17px;color:#3a2e14}
.ephones{display:flex;justify-content:center;gap:14px;height:230px;margin-bottom:-60px}
.mp{width:120px;aspect-ratio:9/19;border-radius:24px;background:var(--ink);padding:6px;transform:rotate(var(--r)) translateY(var(--y))}
.mp div{height:100%;border-radius:19px;overflow:hidden;background:var(--b)}
.mp b{display:flex;align-items:flex-end;height:44%;padding:10px;background:var(--c);color:var(--tc);font-weight:800;font-stretch:72%;font-size:20px;line-height:1}
.state{grid-column:1/-1;display:grid;place-items:center;gap:12px;padding:60px 20px;color:var(--ink-2);text-align:center}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.cats button{min-height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:99px;background:#fff;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.cats button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.st{display:grid;gap:8px;padding:8px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s}
.st:hover{border-color:var(--line-2)}
.st[aria-checked=true]{border-color:var(--cob);box-shadow:0 0 0 3px var(--cob-s)}
.st .sw{height:64px;border-radius:9px;background:var(--c);color:var(--tc);display:flex;align-items:flex-end;padding:8px;font-weight:800;font-stretch:72%;font-size:16px;line-height:1}
.st.serif .sw{font-family:var(--serif);font-stretch:100%;font-weight:700;font-size:14px}
.st small{font-size:12.5px;font-weight:600;color:var(--ink-2);padding:0 2px}
.mbox h2{font-size:34px;margin-bottom:6px}
.mbox .lead{color:var(--ink-2);margin-bottom:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
@media(max-width:760px){.nav{display:none}.who-name{display:none}.empty{grid-template-columns:minmax(0,1fr)}.ephones{display:none}.row2{grid-template-columns:minmax(0,1fr)}.styles{grid-template-columns:repeat(3,minmax(0,1fr))}.top-in{gap:12px}.logo{margin-right:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="/"><span class="mark">ბ</span>ბილდერი</a>
    <nav class="nav" aria-label="მენიუ"><a href="/app/" aria-current="page">ჩემი საიტები</a><a href="/#faq">დახმარება</a></nav>
    <div class="who" id="who" hidden>
      <button class="who-btn" type="button" id="who-btn" aria-expanded="false" aria-haspopup="menu"><span class="av" id="av"></span><span class="who-name" id="who-name"></span></button>
      <div class="menu" id="who-menu" role="menu"><p id="who-mail"></p><button type="button" role="menuitem" id="logout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>გასვლა</button></div>
    </div>
  </div>
</header>

<main>
  <div class="head">
    <div><h1>ჩემი საიტები</h1><div class="usage" id="usage" hidden><span id="usage-t"></span><span class="bar"><i id="usage-bar" style="width:0"></i></span></div></div>
    <button class="btn btn-red" type="button" id="new-top" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>ახალი საიტი</button>
  </div>
  <div class="grid" id="grid"><div class="state"><span class="spin"></span>იტვირთება…</div></div>
</main>

<div class="modal" id="new" aria-hidden="true">
  <form class="mbox" id="new-form" role="dialog" aria-modal="true" aria-labelledby="new-t" novalidate>
    <button class="x" type="button" data-close aria-label="დახურვა"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="new-t">ახალი საიტი</h2>
    <p class="lead">ჩაწერე ძირითადი ინფორმაცია. დანარჩენს რედაქტორში შეცვლი.</p>
    <label class="fld"><span class="lt">ბიზნესის სახელი</span><input class="inp" id="n-name" placeholder="მაგ. ფინჯანი" required maxlength="60"></label>
    <div class="lbl">შაბლონი</div>
    <div class="cats" id="cats" role="group" aria-label="ბიზნესის ტიპი"></div>
    <div class="styles" id="styles" role="radiogroup" aria-label="შაბლონი"></div>
    <div class="row2">
      <label class="fld"><span class="lt">ტელეფონი<small style="margin:0;display:inline">არასავალდებულო</small></span><input class="inp" id="n-phone" inputmode="tel" placeholder="+995 5XX XX XX XX"></label>
      <label class="fld"><span class="lt">მისამართი<small style="margin:0;display:inline">არასავალდებულო</small></span><input class="inp" id="n-addr" placeholder="ქუჩა, ქალაქი"></label>
    </div>
    <div id="n-msg" role="alert"></div>
    <button class="btn btn-red wide" type="submit" id="n-go">საიტის შექმნა</button>
  </form>
</div>

<div class="modal" id="del" aria-hidden="true">
  <div class="mbox" role="alertdialog" aria-modal="true" aria-labelledby="del-t">
    <h2 id="del-t">საიტის წაშლა</h2>
    <p class="lead" id="del-text"></p>
    <div class="row2"><button class="btn btn-line" type="button" data-close>გაუქმება</button><button class="btn btn-red" type="button" id="del-go">წაშლა</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="/js/firebase-config.js"></script>
<script>
/* ბილდერის backend: Firebase Auth (შესვლა) + Firestore (საიტები).
   პარამეტრები public/js/firebase-config.js ფაილშია (window.FIREBASE_CONFIG).
   თუ პარამეტრები არ არის, Backend.configured() აბრუნებს false-ს და გვერდები სატესტო რეჟიმში მუშაობს. */
(function () {
  'use strict';
  if (window.__MOCK_BACKEND) { window.Backend = window.__MOCK_BACKEND; return; } // მხოლოდ ტესტებისთვის

  const V = '11.0.2';
  const CDN = (m) => `https://www.gstatic.com/firebasejs/${V}/firebase-${m}.js`;
  const cfg = () => window.FIREBASE_CONFIG;
  let boot = null;

  function init() {
    if (boot) return boot;
    boot = (async () => {
      if (!cfg() || !cfg().apiKey) return null;
      const [app, A, F] = await Promise.all([import(CDN('app')), import(CDN('auth')), import(CDN('firestore'))]);
      const a = app.initializeApp(cfg());
      const auth = A.getAuth(a);
      auth.languageCode = 'ka';
      return { auth, A, db: F.getFirestore(a), F };
    })();
    return boot;
  }
  const need = async () => { const f = await init(); if (!f) throw Object.assign(new Error('not configured'), { code: 'bilderi/not-configured' }); return f; };
  const uid = (f) => { const u = f.auth.currentUser; if (!u) throw Object.assign(new Error('signed out'), { code: 'bilderi/signed-out' }); return u.uid; };
  const ms = (t) => (t && t.toMillis ? t.toMillis() : 0);
  async function removePublished(f, slug) {
    const F = f.F;
    const imgs = await F.getDocs(F.collection(f.db, 'published', slug, 'images'));
    await Promise.all(imgs.docs.map((d) => F.deleteDoc(d.ref)));
    await F.deleteDoc(F.doc(f.db, 'published', slug));
  }

  const MSG = {
    'auth/invalid-email': 'ელფოსტა არასწორადაა ჩაწერილი.',
    'auth/missing-email': 'ჩაწერე ელფოსტა.',
    'auth/missing-password': 'ჩაწერე პაროლი.',
    'auth/invalid-credential': 'ელფოსტა ან პაროლი არასწორია.',
    'auth/wrong-password': 'ელფოსტა ან პაროლი არასწორია.',
    'auth/user-not-found': 'ამ ელფოსტით ანგარიში ვერ მოიძებნა.',

  const B = {
    configured: () => !!(cfg() && cfg().apiKey),
    message(e) {
      const c = (e && e.code) || '';
      if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
      return MSG[c] || MSG[c.replace(/^firestore\//, '')] || 'რაღაც შეცდომა მოხდა. სცადე თავიდან.';
    },

    async user() { const f = await init(); if (!f) return null; await f.auth.authStateReady(); return f.auth.currentUser; },
    async google() { const f = await need(); const p = new f.A.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); return (await f.A.signInWithPopup(f.auth, p)).user; },
    async signIn(email, pass) { const f = await need(); return (await f.A.signInWithEmailAndPassword(f.auth, email, pass)).user; },
    async signUp(name, email, pass) {
      const f = await need();
      const c = await f.A.createUserWithEmailAndPassword(f.auth, email, pass);
      if (name) await f.A.updateProfile(c.user, { displayName: name });
      try { await f.A.sendEmailVerification(c.user); } catch (e) { /* არ არის აუცილებელი */ }
      return c.user;
    },
    async reset(email) { const f = await need(); return f.A.sendPasswordResetEmail(f.auth, email); },
    async signOut() { const f = await init(); if (f) await f.A.signOut(f.auth); },

    async listSites() {
      const f = await need(), F = f.F;
      const snap = await F.getDocs(F.query(F.collection(f.db, 'sites'), F.where('owner', '==', uid(f))));
      return snap.docs.map((d) => {
        const x = d.data();
        let data = {};
        try { data = JSON.parse(x.data || '{}'); } catch (e) { /* დაზიანებული ჩანაწერი */ }
        return { id: d.id, name: x.name, slug: x.slug, live: x.publishedSlug || null, site: data, published: !!x.published, changed: !!x.published && x.published !== x.data, updated: ms(x.updatedAt) };
      }).sort((a, b) => b.updated - a.updated);
    },
    async createSite(site) {
      const f = await need(), F = f.F;
      const ref = await F.addDoc(F.collection(f.db, 'sites'), { owner: uid(f), name: site.name || '', slug: site.slug || '', data: JSON.stringify(site), published: null, createdAt: F.serverTimestamp(), updatedAt: F.serverTimestamp() });
      return ref.id;
    },
    async loadSite(id) {
      const f = await need(), F = f.F;
      uid(f);
      const snap = await F.getDoc(F.doc(f.db, 'sites', id));
      if (!snap.exists()) throw Object.assign(new Error('missing'), { code: 'not-found' });
      const x = snap.data();
      const imgs = {};
      (await F.getDocs(F.collection(f.db, 'sites', id, 'images'))).forEach((d) => { imgs[d.id] = d.data().data; });
      return { site: JSON.parse(x.data), imgs, published: x.published || null };
    },
    async saveSite(id, site, published) {
      const f = await need(), F = f.F;
      await F.updateDoc(F.doc(f.db, 'sites', id), { name: site.name || '', slug: site.slug || '', data: JSON.stringify(site), published: published || null, updatedAt: F.serverTimestamp() });
    },
    async saveImage(id, imgId, dataUrl) {
      const f = await need(), F = f.F;
      if (dataUrl.length > 1000000) throw Object.assign(new Error('too big'), { code: 'bilderi/too-big' });
      await F.setDoc(F.doc(f.db, 'sites', id, 'images', imgId), { owner: uid(f), data: dataUrl });
    },
    async slugStatus(slug, siteId) {
      const f = await need(), F = f.F, u = uid(f);
      const s = await F.getDoc(F.doc(f.db, 'published', slug));
      if (!s.exists()) return 'free';
      const x = s.data();
      return x.owner === u && x.siteId === siteId ? 'mine' : 'taken';
    },
    async getPublished(slug) {
      const f = await need(), F = f.F;
      const s = await F.getDoc(F.doc(f.db, 'published', slug));
      return s.exists() ? JSON.parse(s.data().data || 'null') : null;
    },
    async publish(siteId, slug, payload, imgs) {
      const f = await need(), F = f.F, u = uid(f);
      const ref = F.doc(f.db, 'published', slug);
      const cur = await F.getDoc(ref);
      if (cur.exists() && (cur.data().owner !== u || cur.data().siteId !== siteId)) throw Object.assign(new Error('taken'), { code: 'bilderi/slug-taken' });
      const siteRef = F.doc(f.db, 'sites', siteId);
      const sdoc = await F.getDoc(siteRef);
      const old = sdoc.exists() ? sdoc.data().publishedSlug : null;
      const used = [...new Set((JSON.stringify(payload).match(/img:[a-z0-9]+/g) || []).map((x) => x.slice(4)))].filter((id) => imgs[id]);
      const have = cur.exists() ? cur.data().imgs || [] : [];
      await F.setDoc(ref, { owner: u, siteId, data: JSON.stringify(payload), imgs: used, updatedAt: F.serverTimestamp() });
      for (const id of used) if (!have.includes(id)) await F.setDoc(F.doc(f.db, 'published', slug, 'images', id), { owner: u, data: imgs[id] });
      if (old && old !== slug) { try { await removePublished(f, old); } catch (e) { /* ძველი მისამართი უკვე წაშლილია */ } }
      await F.updateDoc(siteRef, { publishedSlug: slug });
    },
    async deleteSite(id) {
      const f = await need(), F = f.F;
      uid(f);
      const sd = await F.getDoc(F.doc(f.db, 'sites', id));
      const live = sd.exists() ? sd.data().publishedSlug : null;
      if (live) { try { await removePublished(f, live); } catch (e) { /* უკვე წაშლილია */ } }
      const imgs = await F.getDocs(F.collection(f.db, 'sites', id, 'images'));
      await Promise.all(imgs.docs.map((d) => F.deleteDoc(d.ref)));
      await F.deleteDoc(F.doc(f.db, 'sites', id));
    }
  };
  window.Backend = B;
})();
