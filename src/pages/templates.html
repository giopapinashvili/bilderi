<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>შაბლონი სუფრა</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wdth,wght@62.5..100,300..900&family=Noto+Serif+Georgian:wght@400..800&display=swap">
<style>
/* VOICE  სამუშაო ხელსაწყო, წყნარი: ყურადღება საიტზეა და არა ჩარჩოზე
   IDEA   საბეჭდი მაგიდა: საიტის ანაბეჭდი შუაშია, ზემოთ ნიმუშებს ფურცლავ
   PICTURE თვითონ საიტი, მთელ სცენაზე, ცოცხლად
   COLOUR თეთრი ზოლი და მუქი ტექსტი; სცენა ნეიტრალური ნაცრისფერი, რომ საიტის ფერებს არ ეჯიბრებოდეს
   TYPE   Noto Sans Georgian 400 და 700
   LAYOUT ლეპტოპზე ერთი ზოლი ზემოთ და სცენა ქვემოთ; ტელეფონზე ზოლი ორ რიგად იშლება */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141518);--ink:light-dark(#16171a,#eceef1);--muted:light-dark(#5f626a,#a3a7af);--line:light-dark(#e2e3e6,#2a2c31);--stage:light-dark(#d8d9dc,#0a0b0d);--chip:light-dark(#f0f1f3,#1f2125);--sel:light-dark(#16171a,#eceef1);--selink:light-dark(#ffffff,#141518);--frame:light-dark(#16171a,#2e3035)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Noto Sans Georgian',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #2b6cff;outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:10px max(2vw,16px);border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:2}
.who{flex:1 1 240px}
.who h1{font-size:17px;line-height:1.2;margin:0;font-weight:700}
.who p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;min-height:44px;text-align:left;line-height:1.2}
.seg button span{display:block;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--selink)}
.seg button[aria-pressed=true] span{color:inherit;opacity:.75}
.seg.dev button{padding:6px 12px;display:flex;align-items:center;gap:6px}
.seg svg{width:18px;height:18px;flex:none}
.file{border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:52px;padding:0 16px;font-weight:700}
.file:hover{background:var(--chip)}
.stage{flex:1;background:var(--stage);display:flex;justify-content:center;align-items:flex-start;overflow:auto;position:relative}
#site{border:0;display:block;width:100%;height:100%;background:#fff}
.stage.phone{padding:28px 16px}
.stage.phone #site{width:390px;max-width:100%;height:min(844px,calc(100% - 4px));flex:none;border-radius:30px;box-shadow:0 0 0 10px var(--frame)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5;transform:translateX(102%);transition:transform .22s ease;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dh{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.dh h2{margin:0 0 6px;font-size:22px;line-height:1.2}
.dh p{margin:0 0 10px;color:var(--muted);max-width:52ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:0 0 14px}
.facts b{font-variant-numeric:tabular-nums}
.dact{display:flex;gap:8px}
.dact button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.dact button.pri{background:var(--sel);color:var(--selink);border-color:var(--sel)}
pre{flex:1;margin:0;overflow:auto;padding:16px 20px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--chip);white-space:pre}
.k{color:light-dark(#7a2bbf,#c79bff)}.s{color:light-dark(#0b6b3a,#7fd6a4)}.n{color:light-dark(#b4410b,#ffab70)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:4;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--sel);color:var(--selink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:6;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
@media(max-width:820px){.who{flex-basis:100%}.dev{display:none}}
@media(max-width:600px){.bar{gap:8px}.seg.sites{flex:1;overflow-x:auto;scrollbar-width:none}.seg.sites button{flex:1 0 auto;padding:6px 10px}.seg.sites button span,.file .opt{display:none}.file{min-height:52px;padding:0 12px}}
@media(prefers-reduced-motion:reduce){.drawer,.scrim,.toast{transition:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="who">
    <h1>შაბლონი „სუფრა"</h1>
    <p>ერთი შაბლონი, სამი საიტი. ბიზნესები გამოგონილია, ფოტოების ადგილას ჯერ ნახატებია.</p>
  </div>
  <div class="seg sites" id="tabs" role="group" aria-label="ნიმუში-საიტები"></div>
  <div class="seg dev" role="group" aria-label="ეკრანი">
    <button type="button" id="d-desk" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>კომპიუტერი</button>
    <button type="button" id="d-phone" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>ტელეფონი</button>
  </div>
  <button type="button" class="file" id="open-file"><span class="opt">აღწერის </span>ფაილი</button>
</header>
<main class="stage" id="stage"><iframe id="site" title="საიტის პრევიუ"></iframe></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="აღწერის ფაილი" aria-hidden="true">
  <div class="dh">
    <h2>აღწერის ფაილი</h2>
    <p id="d-text"></p>
    <div class="facts" id="d-facts"></div>
    <div class="dact"><button type="button" class="pri" id="copy">კოპირება</button><button type="button" id="close-file">დახურვა</button></div>
  </div>
  <pre id="json"></pre>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
/*SUPRA*/
</script>
<script>
/*ART*/
</script>
<script>
{
  const SITES = /*SAMPLES*/;
  const $ = (id) => document.getElementById(id);
  const frame = $('site'), stage = $('stage'), tabs = $('tabs'), drawer = $('drawer'), scrim = $('scrim');
  let cur = 0, toastTimer = 0;

  const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600); };
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const pretty = (o) => esc(JSON.stringify(o, null, 2))
    .replace(/("(?:[^"\\]|\\.)*")(\s*:)/g, '<span class="k">$1</span>$2')
    .replace(/:\s("(?:[^"\\]|\\.)*")/g, ': <span class="s">$1</span>')
    .replace(/(^|\s|\[)("(?:[^"\\]|\\.)*")(,?)$/gm, '$1<span class="s">$2</span>$3')
    .replace(/:\s(-?\d+(?:\.\d+)?|true|false)/g, ': <span class="n">$1</span>');

  tabs.innerHTML = SITES.map((s, i) => `<button type="button" data-i="${i}" aria-pressed="false">${esc(s.name)}<span>${esc(s.kind)}</span></button>`).join('');

  function show(i) {
    cur = i;
    const site = SITES[i];
    frame.srcdoc = Supra.renderSite(DemoArt.apply(site));
    tabs.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
    const bytes = new Blob([JSON.stringify(site)]).size;
    const on = site.sections.filter((s) => s.enabled !== false).length;
    const off = site.sections.length - on;
    $('d-text').textContent = `ეს ფაილი არის მთელი საიტი „${site.name}". რედაქტორი მხოლოდ ამ ფაილს შეცვლის, შაბლონი კი მისგან გვერდს ააწყობს.`;
    $('d-facts').innerHTML = `<span>ზომა <b>${(bytes / 1024).toFixed(1)} KB</b></span><span>სექციები <b>${on}</b>${off ? ` ჩართული, <b>${off}</b> გამორთული` : ''}</span><span>შრიფტი <b>${site.theme.font === 'classic' ? 'სერიფიანი' : 'ვიწრო'}</b></span>`;
    $('json').innerHTML = pretty(site);
    if (location.hash.slice(1) !== site.slug) history.replaceState(null, '', '#' + site.slug);
  }

  frame.addEventListener('load', () => {
    const d = frame.contentDocument;
    if (!d) return;
    d.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('a');
      if (!a) return;
      const h = a.getAttribute('href') || '';
      e.preventDefault();
      if (h.startsWith('#')) {
        const el = h === '#top' ? d.body : d.getElementById(h.slice(1));
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        toast('გამოქვეყნებულ საიტზე ეს ღილაკი გაიხსნება: ' + h.replace(/^https?:\/\//, '').replace(/^tel:/, 'ზარი ').slice(0, 48));
      }
    });
  });

  const setDevice = (phone) => {
    stage.classList.toggle('phone', phone);
    $('d-desk').setAttribute('aria-pressed', String(!phone));
    $('d-phone').setAttribute('aria-pressed', String(phone));
  };
  const openFile = (open) => {
    drawer.classList.toggle('open', open);
    drawer.setAttribute('aria-hidden', String(!open));
    scrim.classList.toggle('on', open);
    if (open) $('copy').focus(); else $('open-file').focus();
  };

  tabs.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(Number(b.dataset.i)); });
  $('d-desk').addEventListener('click', () => setDevice(false));
  $('d-phone').addEventListener('click', () => setDevice(true));
  $('open-file').addEventListener('click', () => openFile(true));
  $('close-file').addEventListener('click', () => openFile(false));
  scrim.addEventListener('click', () => openFile(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && drawer.classList.contains('open')) openFile(false); });
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(SITES[cur], null, 2)); toast('ფაილი დაკოპირდა'); }
    catch (err) { toast('კოპირება ვერ მოხერხდა: მონიშნე ტექსტი და დააკოპირე ხელით'); }
  });
  const fromHash = () => { const i = SITES.findIndex((s) => s.slug === location.hash.slice(1)); show(i < 0 ? 0 : i); };
  window.addEventListener('hashchange', fromHash);
  fromHash();
}
</script>
</body>
</html>
